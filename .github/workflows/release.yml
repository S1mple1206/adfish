name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.4
        type: string
      build_ref:
        description: Optional source commit for repackaging
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) throw new Error('Source version does not match release tag')"
      - run: npm test
      - run: npm run dist:windows
      - run: npm run verify:windows
      - name: Upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload $env:RELEASE_TAG dist/adfish-Windows-x64.zip dist/adfish-Windows-x64.zip.sha256 dist/adfish-Windows-arm64.zip dist/adfish-Windows-arm64.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
