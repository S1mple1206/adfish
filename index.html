<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>adfish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="go-home" class="home-button" title="回到主页" aria-label="首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg></button>
    <nav class="browser-nav" aria-label="网页导航">
      <button id="back" title="后退（Alt+←）" aria-label="后退" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
      <button id="forward" title="前进（Alt+→）" aria-label="前进" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></button>
      <button id="reload" title="刷新（F5）" aria-label="刷新" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7"/></svg></button>
    </nav>
    <form id="address-form" class="top-address-form"><input id="address" aria-label="网址或搜索" aria-describedby="address-error" placeholder="网址或搜索" autocomplete="off" spellcheck="false" required><span id="address-error" class="visually-hidden" role="alert"></span></form>
    <nav class="window-controls"><button id="menu-button" title="菜单" aria-label="菜单" aria-haspopup="menu" aria-expanded="false">⋯</button><button id="minimize" title="最小化" aria-label="最小化">−</button><button id="close" title="关闭" aria-label="关闭">×</button></nav>
  </header>
  <section id="error-panel" hidden><h2>暂时无法打开网页</h2><p id="error-detail"></p><button id="retry" class="primary">重新加载</button><p>请检查网络连接或输入其他网址。</p></section>
  <dialog id="settings-dialog">
    <div class="dialog-heading"><h2>窗口设置</h2><button type="button" id="cancel-settings" aria-label="关闭设置">×</button></div>
    <form id="settings-form">
      <p class="help">拖动顶部移动窗口；拖动边缘调整大小。</p>
      <p id="settings-save-status" class="help" role="status">修改后自动保存</p>
      <h3 class="settings-section-title">系统设置</h3>
      <div class="dimensions"><label>宽度 / px<input name="width" type="number" min="300" max="3840" required></label><label>高度 / px<input name="height" type="number" min="220" max="2160" required></label></div>
      <label>主页网址<input name="home" required placeholder="https://www.bing.com"></label>
      <label class="checkbox"><input name="autoScale" type="checkbox">网页随窗口等比例缩放</label>
      <p class="help">窗口缩小时，网页内容和文字会同步缩小。</p>
      <label class="checkbox"><input name="stealthMode" type="checkbox">隐身模式</label>
      <p class="help">移出窗口后隐藏整个窗口，回到原位置时恢复显示。默认开启；菜单范围也算在窗口内。</p>
      <label class="checkbox"><input name="pauseOnLeave" type="checkbox">离开时暂停网页</label>
      <p class="help">移出窗口时暂停正在播放的视频和音频，回来后继续播放。默认关闭；顶部栏和菜单也算在窗口内。</p>
      <label class="checkbox"><input name="quickClose" type="checkbox">快速关闭</label>
      <label>快速关闭按键<input name="quickCloseKey" id="quick-close-key" readonly aria-label="快速关闭按键" title="点击后按下一个按键进行录入"></label>
      <p class="help">双击 Alt 切换手动隐身，隐藏后须再次双击才显示。默认双击 Ctrl 退出软件；点击按键框可录入其他单个按键。请在 450 毫秒内连按两次，隐身和最小化时也有效。录入时暂停上述快捷键。</p>
      <p id="quick-close-error" class="form-error" role="alert"></p>
      <h3 class="settings-section-title">外观设置</h3>
      <label>界面风格<select name="theme"><option value="blue">科技蓝</option><option value="green">自然绿</option><option value="red">活力红</option><option value="amber">暖琥珀</option></select></label>
      <label>窗口标题<input name="title" maxlength="30" required></label>
      <p class="help">Ctrl+L 输入网址 · F5 刷新</p>
      <p id="settings-error" class="form-error" role="alert"></p>
    </form>
  </dialog>
  <script src="renderer.js"></script>
</body>
</html>
